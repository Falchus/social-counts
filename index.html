<!DOCTYPE html>
<html lang="en">

<script src="/social-counts/assets/js/partials.js"></script>

<head>
    <script>Head.load()</script>

    <link rel="canonical" href="//gh.falchus.com/social-counts/">
    <meta property="og:url" content="//gh.falchus.com/social-counts/">
</head>

<body class="fix-header fix-sidebar card-no-border">
    <div id="main-wrapper">
        <header class="topbar">
            <nav class="navbar top-navbar navbar-toggleable-sm navbar-light">
                <div class="navbar-collapse">
                    <ul class="navbar-nav mr-auto mt-md-0">
                        <li class="nav-item">
                            <a class="nav-link nav-toggler hidden-md-up text-muted"
                                href="javascript:void(0)">
                                <i class="fa fa-bars"></i>
                            </a>
                        </li>
                    </ul>
                    <script>Search_Top.load()</script>
                </div>
            </nav>
        </header>
        <script>Sidebar.load()</script>
        <div class="page-wrapper">
            <div class="container super-search nosel">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-block">
                                <div>
                                    <h3 class="card-title text-center">Compare with?</h3>
                                </div>
                                <form class="mx-2 my-auto d-inline w-100" id="search_m">
                                    <div class="input-group">
                                        <input type="text" class="form-control form-control" placeholder="Search"
                                            id="searchvalue_m" autocomplete="off">
                                        <span class="input-group-btn">
                                            <button class="btn btn-success" type="button" id="searchbutton_m">
                                                <i class="fa fa-search"></i>
                                            </button>
                                        </span>
                                    </div>
                                </form>
                                <div class="results" id="results">

                                </div>
                                <div>
                                    <button class="btn btn-danger w-100" id="comrest">
                                        <i class="fa fa-times"></i> Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="card m-b-0 m-t-20">
                            <img class="card-img-top img-responsive" src="/social-counts/assets/images/banner.png" id="cover">
                            <div class="card-block little-profile p-b-0 text-center">
                                <div class="pro-img">
                                    <img src="//falchus.com/logo" alt="user" id="profile">
                                </div>
                                <h3 class="display-6 m-b-15 m-t-10 text-center name" id="name">Falchus.com</h3>
                            </div>
                            <div class="card-block text-center p-t-0">
                                <div class="card-body">
                                    <div class="position-relative">
                                        <div class="white">
                                            <h1 class="display-1" id="subs">0</h1>
                                            <span>Subscribers</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row" id="sharer">
                    <div class="col-12">
                        <div class="card-block text-center">
                            <div class="text-center p-t-0 row">
                                
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12" id="sharear2">
                        <div class="row">
                            <div class="col-12 col-lg-7">
                                <div class="card">
                                    <div class="card-block">
                                        <div class="card-body">
                                            <div class="position-relative">
                                                <div class="mt-2 ml-2 white">
                                                    <h1 class="display-5" id="views">0</h1>
                                                    <span>Views</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 col-lg-5">
                                <div class="card">
                                    <div class="card-block">
                                        <div class="card-body">
                                            <div class="position-relative">
                                                <div class="mt-2 ml-2 white">
                                                    <h1 class="display-5" id="videos">0</h1>
                                                    <span>Videos</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <script>window.Chart.load()</script>
            </div>
            <script>Footer.load()</script>
        </div>
    </div>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        window.Tether = function () { } // I don't want Bootstrap to use Tether.
    </script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.0.0-alpha.6/js/bootstrap.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/sticky-kit/1.1.3/sticky-kit.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script src="/social-counts/assets/js/chart.js"></script>
    <script src="/social-counts/assets/js/custom-ui.js"></script>

    <script src="/social-counts/assets/js/base.js"></script>
    <script src="/social-counts/assets/js/platform/yt/updateManager.core.js"></script>
    <script src="/social-counts/assets/js/platform/yt/query.core.js"></script>
    <script src="/social-counts/assets/js/platform/yt/multisearch.core.js"></script>
    <script src="/social-counts/assets/js/platform/yt/live.core.js"></script>
    <script src="/social-counts/assets/js/platform/yt/urlManager.core.js"></script>
    <script src="/social-counts/assets/js/platform/yt/init.js"></script>
</body>
</html>
